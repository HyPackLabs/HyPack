name: Feature request
description: Suggest an idea for HyPack
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Share an idea for HyPack. Feature requests help us prioritize what to build next.

  - type: textarea
    id: feature-problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve? Who benefits?
      placeholder: As a modpack creator, I want to…
    validations:
      required: true

  - type: textarea
    id: feature-solution
    attributes:
      label: Proposed solution
      description: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: feature-alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you have thought about?

  - type: dropdown
    id: feature-area
    attributes:
      label: Area
      options:
        - Modpack builder
        - Explore and discovery
        - Export
        - Auth and accounts
        - Blog, guides, and changelog
        - UI and design
        - API and backend
        - Other
    validations:
      required: true

  - type: checkboxes
    id: feature-checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for similar requests
          required: true

  - type: textarea
    id: feature-extra
    attributes:
      label: Additional context
      description: Mockups, links, or examples from other tools.
